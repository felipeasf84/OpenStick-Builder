name: Build

on:
  workflow_dispatch:

env:
  RELEASE: bookworm   # 'stable' (trixie) breaks setup.sh on libconfig9

jobs:
  build:
    # ubuntu-22.04's debian-archive-keyring stops at bullseye; 24.04 ships the bookworm keys
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Drop runner's broken third-party apt repos
        # packages.microsoft.com answers 403 / "no longer signed" and makes apt update fail
        run: |
          grep -ls packages.microsoft.com /etc/apt/sources.list.d/* | xargs -r sudo rm -fv

      - name: Install dependencies
        run: sudo sh -e scripts/install_deps.sh

      - name: Build hyp and aboot firmware
        run: sudo sh -e scripts/build_hyp_aboot.sh

      - name: Extract MSM8916 firmware
        run: sudo sh -e scripts/extract_fw.sh

      - name: Create rootfs
        run: sudo --preserve-env=RELEASE sh -e scripts/debootstrap.sh

      - name: Build gadget-tool
        run: sudo sh -e scripts/build_gt.sh

      - name: Create images
        run: sudo sh -e scripts/build_images.sh

      - name: Add MF800 DTB and checksums
        run: |
          sudo cp dtbs/msm8916-fy-mf800.dtb files/
          cd files && sudo sh -c 'sha256sum * > SHA256SUMS' && cat SHA256SUMS

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openstick-debian-fy-mf800
          path: files/*
