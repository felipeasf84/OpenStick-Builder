name: kmod-usbserial
# Out-of-tree cdc-acm (+ usbserial/cp210x/ftdi_sio/ch341) for the running pmOS kernel
# linux-postmarketos-qcom-msm8916 6.6-r5 (vermagic "6.6.0-msm8916 SMP preempt mod_unload aarch64").
# Isolated from the image build; nothing here touches boot/rootfs.
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - name: "Deps"
        run: sudo apt-get update -qq && sudo apt-get install -y -qq build-essential bc bison flex libssl-dev libelf-dev
      - name: "Fetch kernel source (tag v6.6-msm8916, tarball: no .git -> no '+' in kernelrelease)"
        run: |
          curl -sSfL -o k.tar.gz https://github.com/msm8916-mainline/linux/archive/refs/tags/v6.6-msm8916.tar.gz
          sha256sum k.tar.gz
          mkdir linux && tar xzf k.tar.gz -C linux --strip-components=1
      - name: "Configure (device /proc/config.gz + USB_ACM/serial as modules, no gcc plugins)"
        working-directory: linux
        run: |
          cp ../kmod/config-6.6.0-msm8916 .config
          scripts/config --module USB_ACM --module USB_SERIAL --module USB_SERIAL_CP210X \
                         --module USB_SERIAL_FTDI_SIO --module USB_SERIAL_CH341 --disable GCC_PLUGINS
          make olddefconfig
          echo "--- config diff vs device:"; diff <(grep -v '^#' ../kmod/config-6.6.0-msm8916 | grep -vE 'CC_VERSION_TEXT|GCC_VERSION|AS_VERSION|LD_VERSION|PAHOLE_VERSION|CC_HAS|CC_CAN|AS_HAS|TOOLS_SUPPORT|GCC_PLUGINS|CONFIG_HAVE_|CONFIG_CC_IS|CONFIG_LD_IS|CONFIG_AS_IS|RUSTC|BINDGEN|=$' | sort) \
                                                 <(grep -v '^#' .config | grep -vE 'CC_VERSION_TEXT|GCC_VERSION|AS_VERSION|LD_VERSION|PAHOLE_VERSION|CC_HAS|CC_CAN|AS_HAS|TOOLS_SUPPORT|GCC_PLUGINS|CONFIG_HAVE_|CONFIG_CC_IS|CONFIG_LD_IS|CONFIG_AS_IS|RUSTC|BINDGEN|=$' | sort) || true
      - name: "modules_prepare + build modules"
        working-directory: linux
        run: |
          make -j$(nproc) modules_prepare
          echo "kernelrelease: $(make -s kernelrelease)"
          make -j$(nproc) KBUILD_MODPOST_WARN=1 M=drivers/usb/class modules
          make -j$(nproc) KBUILD_MODPOST_WARN=1 M=drivers/usb/serial modules
      - name: "Collect + check vermagic"
        run: |
          mkdir out
          cp linux/drivers/usb/class/cdc-acm.ko linux/drivers/usb/serial/{usbserial,cp210x,ftdi_sio,ch341}.ko out/
          cd out
          for k in *.ko; do echo "$k: $(modinfo -F vermagic $k) | depends=$(modinfo -F depends $k)"; done
          for k in *.ko; do [ "$(modinfo -F vermagic $k)" = "6.6.0-msm8916 SMP preempt mod_unload aarch64" ] || { echo "VERMAGIC MISMATCH $k"; exit 1; }; done
          for k in *.ko; do nm -u $k | awk '{print $2}' > ${k%.ko}.undef; done
          sha256sum *.ko > SHA256SUMS; cat SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: kmod-usbserial-6.6.0-msm8916
          path: out/
